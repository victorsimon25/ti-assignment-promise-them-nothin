services:
  redis:
    image: redis:7-alpine
    container_name: rlt-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rlt-app-1
    environment:
      - PORT=8080
      - NODE_ID=node-1
      - REDIS_URL=redis:6379
      - ALLOW_MOCK_TIME=true
    depends_on:
      redis:
        condition: service_healthy

  app-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rlt-app-2
    environment:
      - PORT=8080
      - NODE_ID=node-2
      - REDIS_URL=redis:6379
      - ALLOW_MOCK_TIME=true
    depends_on:
      redis:
        condition: service_healthy

  app-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rlt-app-3
    environment:
      - PORT=8080
      - NODE_ID=node-3
      - REDIS_URL=redis:6379
      - ALLOW_MOCK_TIME=true
    depends_on:
      redis:
        condition: service_healthy

  lb:
    image: nginx:alpine
    container_name: rlt-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-1
      - app-2
      - app-3
